<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6a00">

<title>FF Arena — Brevent, SetEdit e Dicas FF</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#080808;
  color:#fff;
  line-height:1.6;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#101010;
  border-bottom:1px solid #292929;
  padding:14px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#ff7200;
  font-size:23px;
  font-weight:900;
}

nav{
  display:flex;
  gap:14px;
  overflow-x:auto;
}

nav a{
  color:#ddd;
  text-decoration:none;
  white-space:nowrap;
  font-size:14px;
}

nav a:hover{
  color:#ff7200;
}

.hero{
  padding:75px 7%;
  text-align:center;
  background:
  radial-gradient(circle at top,#4b2005 0%,#111 40%,#080808 75%);
}

.hero h1{
  font-size:42px;
  margin-bottom:12px;
}

.orange{
  color:#ff7200;
}

.hero p{
  max-width:700px;
  margin:auto;
  color:#bbb;
}

.btn{
  display:inline-block;
  margin-top:25px;
  background:#ff7200;
  color:#fff;
  padding:12px 22px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

.container{
  width:90%;
  max-width:1100px;
  margin:auto;
}

section{
  padding:55px 0;
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title h2{
  font-size:30px;
}

.title p{
  color:#999;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
}

.card{
  background:#111;
  border:1px solid #282828;
  border-radius:15px;
  padding:22px;
  box-shadow:0 8px 25px #0005;
}

.card h3{
  color:#ff7200;
  margin-bottom:10px;
}

.card p,.card li{
  color:#bbb;
  font-size:14px;
}

.card ul{
  padding-left:20px;
}

.command{
  margin-top:15px;
  background:#050505;
  border:1px solid #303030;
  border-radius:10px;
  padding:12px;
}

.command code{
  color:#62ff91;
  font-size:13px;
  word-break:break-all;
}

.copy{
  margin-top:10px;
  border:0;
  background:#ff7200;
  color:white;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.tip{
  border-left:4px solid #ff7200;
  background:#151515;
  padding:15px;
  margin:12px 0;
  border-radius:8px;
  color:#ccc;
}

.warning{
  border-left:4px solid #ff3b30;
  background:#1a1010;
  padding:17px;
  border-radius:10px;
  margin-top:20px;
  color:#ddd;
}

.ad{
  min-height:90px;
  border:1px dashed #444;
  background:#0d0d0d;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#666;
  margin:25px 0;
  border-radius:10px;
  font-size:13px;
}

.faq{
  margin-bottom:12px;
}

.faq summary{
  cursor:pointer;
  background:#131313;
  padding:15px;
  border-radius:9px;
  color:#fff;
  font-weight:bold;
}

.faq p{
  padding:12px 15px;
  color:#aaa;
}

footer{
  text-align:center;
  padding:35
